name: Main Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'rc-*'

jobs:
  unit_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run tests via Fastlane
        run: bundle exec fastlane android test

  build:
    name: Build and upload to TestApp.io
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build release via Fastlane
        if: startsWith(github.ref, 'refs/heads/main')
        run: bundle exec fastlane android build_release

      - name: Build release for tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bundle exec fastlane android build_release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/debug/app-debug 2.apk
            app/build/outputs/mapping/release/mapping.txt

  deploy_testapp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Deploy RC to Testapp.io
        if: startsWith(github.ref, 'refs/tags/rc-')
        env:
          TESTAPP_TOKEN: ${{ secrets.TESTAPP_TOKEN }}
          TESTAPP_ID: ${{ secrets.TESTAPP_ID }}
        run: bundle exec fastlane android deploy_testapp

  deploy_play_internal:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Write Play Store JSON
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > fastlane/play-service-account.json

      - name: Deploy to Play Internal Track
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GOOGLE_PLAY_JSON_KEY: fastlane/play-service-account.json
        run: bundle exec fastlane android deploy_play_internal