name: Build to upload apk to Testapp.io

on:
  workflow_dispatch:
  push:
      branches: [ main ]

jobs:
  android:
    name: Build and upload to Testapp.io
    runs-on: ubuntu-latest

    steps:
      - run: echo "Starting the build process..."
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.0'
          bundler-cache: true

      - uses: maierj/fastlane-action@v2.2.0
        env:
          TESTAPPIO_API_TOKEN: ${{ secrets.API_TOKEN }}
          TESTAPPIO_APP_ID: ${{ secrets.APP_ID }}
        with:
          lane: "android deploy_testapp"
          verbose: true